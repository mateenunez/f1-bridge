services:
  f1-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1_bridge
    restart: always
    network_mode: "host"
    environment:
      - DROPLET_PORT: ${DROPLET_PORT:-aport}
      - F1TVSUBSCRIPTION_TOKEN: ${F1TVSUBSCRIPTION_TOKEN:-f1tvtoken}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"