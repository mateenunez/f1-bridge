services:
  f1-bridge:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1-bridge-app
    restart: always
    ports:
      - "5631:5631"
      - "3005:3005"
    environment:
      F1_RECORDINGS_DIR: /app/recordings
    volumes:
      - ./.env:/app/.env
      - ./recordings:/app/recordings