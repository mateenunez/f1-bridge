services:
  f1-bridge:
    env_file:
      - .env
    environment:
      BRIDGE_PORT: ${BRIDGE_PORT}
      F1TVSUBSCRIPTION_TOKEN: ${F1TVSUBSCRIPTION_TOKEN}
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
      NGROK_DOMAIN: ${NGROK_DOMAIN}
      F1T_API_URL: ${F1T_API_URL}
      F1T_API_TOKEN: ${F1T_API_TOKEN}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1-bridge-app
    restart: always
    ports:
      - "5631:5631"
      - "3005:3005"
    volumes:
      - ./.env:/app/.env