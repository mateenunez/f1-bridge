name: Deploy Bridge to VPS

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push f1-bridge
        run: |
          # Construimos usando la carpeta f1-bridge como contexto
          docker build -t ${{ secrets.DOCKER_USERNAME }}/f1-bridge:latest ./f1-bridge
          docker push ${{ secrets.DOCKER_USERNAME }}/f1-bridge:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/f1t-dock
            # Actualizamos solo el servicio del bridge
            docker-compose pull bridge-service
            docker-compose up -d bridge-service
